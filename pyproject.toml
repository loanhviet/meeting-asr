[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meeting-asr"
version = "0.1.0"
description = "Vietnamese meeting minutes ASR research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "pyloudnorm>=0.1.1,<1",
  "jiwer>=4,<5",
  "pyannote.metrics>=3.2,<4",
  "python-dotenv>=1,<2",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
demo = ["edge-tts>=7.2,<8"]
api = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1", "filelock>=3.15,<5", "reportlab>=4.2,<5",
]
inference = [
  "torch>=2.5,<2.9",
  "torchaudio>=2.5,<2.9",
  "transformers>=4.45,<5",
  "huggingface-hub>=0.28,<1",
  "pyannote.audio==3.4.0",
  "speechbrain>=1.0,<2",
  "silero-vad>=6,<7",
]

[project.scripts]
meeting-asr = "meeting_asr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_asr"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "meeting_asr/configs/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
