name: Checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: uv sync --locked --extra dev --extra api
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src/meeting_asr tests
      - run: uv run --no-sync ruff format --check src/meeting_asr tests
      - run: uv build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data results .cache "$HOME/.cache/huggingface"
      - run: docker compose config --quiet && docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - run: DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:3000/api/health && curl --fail --output /dev/null http://127.0.0.1:3000/
      - run: docker compose exec -T api meeting-asr doctor
      - if: always()
        run: docker compose logs --tail=50 && docker compose down
